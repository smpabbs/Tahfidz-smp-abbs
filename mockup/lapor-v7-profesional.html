<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup v7 — Lapor Tahfidz Profesional · 3 Varian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Mockup v7 — arah desain profesional untuk Lapor Tahfidz.
   Catatan eksplorasi (agar pass berikutnya tahu apa yang dicoba):
   - v1–v6 & live = krem/emas/Amiri (arah "heritage") → dianggap kurang
     profesional; layar pertama didominasi merah alarm; emoji di kontrol.
   - v7 = 3 identitas baru, data real, warna status hanya di indikator
     kecil, aturan hitung dilipat.
   A · Ledger  : netral + hijau zamrud, tabel presisi, Plus Jakarta Sans.
   B · Konsol  : shell gelap + kanvas terang, Inter ( Continu dari
                 konsol panitia avatar yang sudah disetujui user ).
   C · Institusi: banner hijau solid + kartu statistik overlap,
                 Source Serif 4 untuk judul/angka.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}
button:focus-visible,a:focus-visible,details:focus-visible,summary:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{min-height:100vh;padding-bottom:84px}
#app{min-height:100vh}
.tA,.tB,.tC{display:none;min-height:100vh}
body.shA .tA{display:block}
body.shB .tB{display:block}
body.shC .tC{display:block}

/* warna status dipakai bersama (dosis kecil saja) */
.st-good{color:#1B7F4D}.st-warn{color:#A96D12}.st-bad{color:#B3403A}
.bar{height:8px;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.sesi{display:inline-flex;gap:4px;align-items:center}
.sesi i{width:9px;height:9px;border-radius:50%}
.sesi .f{background:#1B7F4D}.sesi .p{background:#C08A2D}.sesi .m{background:#C96055}
.legend{display:inline-flex;gap:12px;align-items:center;font-size:11px;font-weight:600}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:8px;height:8px;border-radius:50%}
.gear{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.gear svg{width:15px;height:15px}

/* ===== dock pemilih varian ===== */
#dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:99;
  display:flex;align-items:center;gap:4px;background:#16181A;border-radius:14px;padding:6px;
  box-shadow:0 12px 32px rgba(0,0,0,.35)}
#dock .lbl{font:600 11px/1 'Plus Jakarta Sans',sans-serif;color:#8B9298;padding:0 10px 0 8px}
#dock button{font:700 12px/1 'Plus Jakarta Sans',sans-serif;color:#C9CED3;padding:9px 14px;border-radius:9px;white-space:nowrap}
#dock button:hover{background:#24272A;color:#fff}
#dock button.on{background:#F4F4F1;color:#16181A}
#dock button b{font-weight:800}

/* ===================== VARIAN A · LEDGER ===================== */
.tA{background:#F5F6F4;color:#17201B;font-family:'Plus Jakarta Sans',sans-serif}
.tA a{color:inherit}
.a-top{position:sticky;top:0;z-index:20;background:rgba(245,246,244,.94);backdrop-filter:blur(8px);border-bottom:1px solid #E4E7E3}
.a-in{max-width:1080px;margin:0 auto;padding:12px 24px 10px}
.a-r1{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.a-brand{font-size:16px;font-weight:800;letter-spacing:-.2px}
.a-brand .mark{display:inline-block;width:10px;height:10px;border-radius:3px;background:#0B6B55;margin-right:8px;transform:rotate(45deg)}
.a-seg{display:flex;background:#fff;border:1px solid #E0E4E0;border-radius:10px;padding:3px;margin-left:auto}
.a-seg button{font-size:12.5px;font-weight:700;color:#66716B;padding:7px 14px;border-radius:7px}
.a-seg button.on{background:#0B6B55;color:#fff}
.a-tabs{display:flex;gap:2px;background:#ECEEEB;border-radius:10px;padding:3px}
.a-tabs button{font-size:12.5px;font-weight:700;color:#66716B;padding:7px 12px;border-radius:7px}
.a-tabs button.on{background:#fff;color:#17201B;box-shadow:0 1px 2px rgba(23,32,27,.12)}
.a-gear{color:#66716B;border:1px solid #E0E4E0;background:#fff;border-radius:10px}
.a-r2{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.a-nav{width:30px;height:30px;border-radius:9px;border:1px solid #E0E4E0;background:#fff;color:#0B6B55;font-size:15px}
.a-per{font-size:14.5px;font-weight:700}
.a-per small{display:block;font-size:11px;font-weight:600;color:#79857D;margin-top:1px}
.a-today{font-size:12px;font-weight:700;color:#0B6B55;border:1px solid #CBDDD6;background:#fff;border-radius:8px;padding:6px 10px}
.a-wrap{max-width:1080px;margin:0 auto;padding:16px 24px 60px}
.a-cara{font-size:12px;color:#66716B;margin-bottom:14px}
.a-cara summary{cursor:pointer;font-weight:700;color:#0B6B55;list-style:none;display:inline-flex;gap:6px;align-items:center}
.a-cara summary::-webkit-details-marker{display:none}
.a-cara summary .ic{width:15px;height:15px;border:1.5px solid #0B6B55;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.a-cara p{margin-top:8px;line-height:1.6;max-width:76ch;background:#fff;border:1px solid #E4E7E3;border-radius:10px;padding:12px 14px}
.a-tape{display:flex;align-items:stretch;background:#fff;border:1px solid #E4E7E3;border-radius:14px;padding:18px 6px;margin-bottom:22px}
.a-stat{flex:1;padding:2px 22px;border-right:1px solid #EDEFEA}
.a-stat:last-child{border-right:0}
.a-stat b{font-size:27px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.a-stat span{font-size:12px;font-weight:600;color:#79857D}
.a-stat .tr{display:block;margin-top:7px;font-size:11px;font-weight:700}
.a-trend{display:flex;gap:3px;align-items:flex-end;height:26px;margin-top:8px}
.a-trend i{width:7px;border-radius:2px;background:#D8DED9}
.a-trend i.cur{background:#0B6B55}
.a-h{display:flex;align-items:baseline;gap:10px;margin:20px 0 10px}
.a-h h2{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.a-h span{font-size:12px;color:#79857D;font-weight:600}
.a-h .legend{margin-left:auto;color:#79857D}
.a-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #E4E7E3;border-radius:14px;overflow:hidden}
.a-table thead th{font-size:11px;font-weight:700;color:#79857D;text-align:left;padding:10px 16px;border-bottom:1px solid #E4E7E3;background:#FAFBF9}
.a-table thead th.r{text-align:right}
.a-table td{padding:13px 16px;border-bottom:1px solid #EFF1EC;vertical-align:middle}
.a-table tr:last-child td{border-bottom:0}
.a-table tr.rowh:hover{background:#F7FAF8;cursor:pointer}
.a-g nm,.a-g .nm{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.a-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.a-meta{font-size:11.5px;color:#79857D;font-weight:500;margin-top:2px}
.a-prog{display:flex;align-items:center;gap:10px}
.a-prog .bar{flex:1;background:#E8ECE9;min-width:70px}
.a-prog b{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;width:38px;text-align:right}
.a-sdelta{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.a-detail{margin-top:26px}
.a-panel{background:#fff;border:1px solid #E4E7E3;border-radius:14px;overflow:hidden}
.a-ph{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid #EFF1EC;flex-wrap:wrap}
.a-ph h3{font-size:14.5px;font-weight:800}
.a-ph .sub{font-size:12px;color:#79857D;font-weight:600}
.a-ph .legend{margin-left:auto}
.a-kelas-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid #EFF1EC}
.a-kc{padding:14px 18px;border-right:1px solid #EFF1EC;cursor:pointer}
.a-kc:hover{background:#F7FAF8}
.a-kc:last-child{border-right:0}
.a-kc .kn{font-size:13px;font-weight:700;display:flex;gap:7px;align-items:center}
.a-kc .km{font-size:11.5px;color:#79857D;font-weight:500;margin-top:2px}
.a-kc .a-prog{margin-top:9px}
.a-sw{font-size:12px;font-weight:700;color:#0B6B55;padding:11px 18px;display:block;text-align:center;width:100%}
.a-sw:hover{background:#F7FAF8}

/* ===================== VARIAN B · KONSOL ===================== */
.tB{background:#F4F4F1;color:#191C1E;font-family:'Inter',sans-serif}
.b-top{position:sticky;top:0;z-index:20;background:#1A1C1F;border-bottom:1px solid #2C2F33}
.b-in{max-width:1140px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.b-brand{color:#fff;font-size:14.5px;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:9px}
.b-brand .mark{width:22px;height:22px;border-radius:7px;background:#0E7A5F;display:inline-flex;align-items:center;justify-content:center}
.b-brand .mark i{width:8px;height:8px;border-radius:2px;background:#fff;display:block}
.b-seg{display:flex;background:#24272A;border-radius:9px;padding:3px;gap:2px}
.b-seg button{font-size:12.5px;font-weight:600;color:#9AA1A7;padding:6px 13px;border-radius:7px}
.b-seg button.on{background:#F4F4F1;color:#191C1E}
.b-tabs{display:flex;background:#24272A;border-radius:9px;padding:3px;gap:2px;margin-left:auto}
.b-tabs button{font-size:12.5px;font-weight:600;color:#9AA1A7;padding:6px 12px;border-radius:7px}
.b-tabs button.on{background:#3ADD9F;color:#0C241B}
.b-gear{color:#9AA1A7;border:1px solid #2C2F33;border-radius:9px}
.b-gear:hover{color:#fff}
.b-in2{max-width:1140px;margin:0 auto;padding:0 24px 11px;display:flex;align-items:center;gap:12px}
.b-nav{width:28px;height:28px;border-radius:8px;background:#24272A;color:#E7E9EA;font-size:14px}
.b-nav:hover{background:#2E3236}
.b-per{color:#E7E9EA;font-size:13.5px;font-weight:600}
.b-per small{color:#8B9298;font-weight:500;font-size:11.5px}
.b-today{font-size:12px;font-weight:600;color:#3ADD9F;background:#15302A;border-radius:8px;padding:6px 11px}
.b-wrap{max-width:1140px;margin:0 auto;padding:20px 24px 60px}
.b-strip{display:flex;background:#fff;border:1px solid #E6E6E1;border-radius:14px;margin-bottom:20px}
.b-stat{flex:1;padding:16px 22px;border-right:1px solid #EEEEE9}
.b-stat:last-child{border-right:0}
.b-stat b{font-size:26px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.b-stat span{font-size:12px;color:#75797D;font-weight:500}
.b-stat .tr{display:block;margin-top:5px;font-size:11.5px;font-weight:700}
.b-cols{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.b-tape{display:flex;background:#fff;border:1px solid #E6E6E1;border-radius:14px;margin-bottom:20px}
.b-trend{display:flex;gap:3px;align-items:flex-end;height:26px;margin-top:8px}
.b-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.b-h h2{font-size:14.5px;font-weight:700}
.b-h span{font-size:12px;color:#75797D}
.b-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.b-card{background:#fff;border:1px solid #E6E6E1;border-radius:13px;padding:15px 16px;cursor:pointer;transition:border-color .12s}
.b-card:hover{border-color:#0E7A5F}
.b-card .nm{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.b-card .meta{font-size:11.5px;color:#75797D;margin-top:3px;font-weight:500}
.b-prog{display:flex;align-items:center;gap:10px;margin-top:12px}
.b-prog .bar{flex:1;background:#ECECE7}
.b-prog b{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.b-sesi{margin-top:10px;display:flex;align-items:center;gap:8px}
.b-sesi .lb{font-size:10.5px;color:#75797D;font-weight:600}
.b-aside{display:flex;flex-direction:column;gap:14px}
.b-panel{background:#fff;border:1px solid #E6E6E1;border-radius:13px;padding:14px 16px}
.b-panel h3{font-size:12.5px;font-weight:700;margin-bottom:3px}
.b-panel .sub{font-size:11.5px;color:#75797D;margin-bottom:10px}
.b-krow{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid #F1F1EC;font-size:12.5px}
.b-krow:last-child{border-bottom:0}
.b-krow b{width:30px;font-weight:700;font-variant-numeric:tabular-nums}
.b-krow .bar{flex:1;background:#ECECE7}
.b-krow em{font-style:normal;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;width:34px;text-align:right}
.b-note{font-size:12px;line-height:1.6;color:#4C5450}
.b-note b{color:#191C1E}
.b-detail{margin-top:20px}

/* ===================== VARIAN C · INSTITUSI ===================== */
.tC{background:#F1F4F1;color:#14231D;font-family:'Plus Jakarta Sans',sans-serif}
.c-band{background:#0F3D31;color:#fff;padding:22px 0 58px}
.c-in{max-width:1080px;margin:0 auto;padding:0 24px}
.c-r1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.c-brand{font-family:'Source Serif 4',Georgia,serif;font-size:20px;font-weight:600;letter-spacing:.1px}
.c-brand small{font-family:'Plus Jakarta Sans',sans-serif;font-size:11.5px;font-weight:700;color:#9FC3B6;display:block;margin-top:2px;letter-spacing:.3px}
.c-seg{display:flex;border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:3px;gap:2px;margin-left:auto}
.c-seg button{font-size:12.5px;font-weight:700;color:#CBDDD6;padding:7px 14px;border-radius:7px}
.c-seg button.on{background:#fff;color:#0F3D31}
.c-gear{color:#CBDDD6;border:1px solid rgba(255,255,255,.28);border-radius:10px}
.c-gear:hover{color:#fff}
.c-r2{display:flex;align-items:flex-end;gap:16px;margin-top:26px;flex-wrap:wrap}
.c-per h1{font-family:'Source Serif 4',Georgia,serif;font-size:29px;font-weight:600;letter-spacing:-.2px;line-height:1.15}
.c-per p{font-size:12.5px;color:#9FC3B6;font-weight:600;margin-top:5px}
.c-nav{display:flex;gap:8px;align-items:center}
.c-nav button{width:34px;height:34px;border:1px solid rgba(255,255,255,.28);border-radius:9px;color:#fff;font-size:16px}
.c-nav button:hover{background:rgba(255,255,255,.12)}
.c-nav .now{width:auto;padding:0 13px;font-size:12.5px;font-weight:700}
.c-tabs{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:3px;gap:2px}
.c-tabs button{font-size:12.5px;font-weight:700;color:#CBDDD6;padding:7px 12px;border-radius:7px}
.c-tabs button.on{background:#fff;color:#0F3D31}
.c-wrap{max-width:1080px;margin:0 auto;padding:24px 24px 60px}
.c-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.c-stat{background:#fff;border:1px solid #E2E8E3;border-radius:14px;padding:16px 20px;box-shadow:0 6px 18px rgba(15,61,49,.07)}
.c-stat b{font-family:'Source Serif 4',Georgia,serif;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.c-stat span{font-size:12px;font-weight:600;color:#6E7C74}
.c-stat .tr{display:block;font-size:11.5px;font-weight:700;margin-top:6px}
.c-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 12px}
.c-h h2{font-family:'Source Serif 4',Georgia,serif;font-size:18px;font-weight:600}
.c-h span{font-size:12px;color:#6E7C74;font-weight:600}
.c-h .legend{margin-left:auto;color:#6E7C74}

/* ===== kartu & drill-down (varian C) ===== */
.c-note{font-size:12px;color:#6E7C74;margin-bottom:14px}
.c-note summary{cursor:pointer;font-weight:700;color:#0F5C48;list-style:none;display:inline-flex;gap:6px;align-items:center}
.c-note summary::-webkit-details-marker{display:none}
.c-note summary .ic{width:15px;height:15px;border:1.5px solid #0F5C48;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.c-note p{margin-top:8px;line-height:1.6;max-width:76ch;background:#fff;border:1px solid #E2E8E3;border-radius:10px;padding:12px 14px}
.c-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.c-cards-guru{grid-template-columns:repeat(4,1fr)}
.c-gcard{background:#fff;border:1px solid #E2E8E3;border-radius:14px;padding:16px;cursor:pointer;
  box-shadow:0 2px 8px rgba(15,61,49,.05);transition:box-shadow .15s,transform .15s}
.c-gcard:hover{box-shadow:0 10px 24px rgba(15,61,49,.12);transform:translateY(-2px)}
.gc-top{display:flex;gap:12px;align-items:center}
.gc-badge{width:44px;height:44px;border-radius:12px;background:#0F3D31;color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;flex-shrink:0}
.gc-who{flex:1;min-width:0}
.gc-who b{font-size:14px;font-weight:800;display:block;line-height:1.25}
.gc-who span{display:block;font-size:11.5px;color:#6E7C74;font-weight:600;margin-top:2px}
.gc-donut{position:relative;flex-shrink:0}
.gc-dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gc-dc b{font-family:'Source Serif 4',Georgia,serif;font-size:16px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.gc-dc span{font-size:7.5px;font-weight:700;color:#6E7C74;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.gc-foot{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:10px;border-top:1px dashed #E7EEE8}
.gc-foot .lb{font-size:10.5px;color:#6E7C74;font-weight:600}
.gc-foot .last{margin-left:auto;font-size:10.5px;color:#6E7C74;font-weight:600}
.gc-days{display:flex;gap:6px;margin-top:12px}
.gc-days span{flex:1;text-align:center}
.gc-days i{display:block;height:8px;border-radius:99px;background:#E7EDE8}
.gc-days i.f{background:#1B7F4D}.gc-days i.p{background:#C08A2D}.gc-days i.m{background:#C96055}
.gc-days em{font-style:normal;font-size:9px;font-weight:700;color:#6E7C74;display:block;margin-top:3px}
.c-topnav{display:flex;align-items:baseline;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
.c-back{font-size:12.5px;font-weight:700;color:#0F5C48;background:#fff;border:1px solid #E2E8E3;border-radius:9px;padding:7px 12px}
.c-back:hover{background:#F7FAF7}
.c-topnav h2{font-family:'Source Serif 4',Georgia,serif;font-size:21px;font-weight:600}
.c-topnav .sub2{font-size:12px;color:#6E7C74;font-weight:600}
.c-summary{display:flex;align-items:center;gap:18px;padding:16px 20px;flex-wrap:wrap}
.c-summary .gc-badge{width:54px;height:54px;font-size:16px}
.c-sum-who{flex:1;min-width:180px}
.c-sum-who b{font-family:'Source Serif 4',Georgia,serif;font-size:19px;font-weight:600;display:block}
.c-sum-who span{font-size:12.5px;color:#6E7C74;font-weight:600;display:block;margin-top:2px}
.c-shead{display:flex;align-items:baseline;gap:10px;padding:14px 20px 6px}
.c-shead b{font-size:13.5px;font-weight:800}
.c-shead span{font-size:12px;color:#6E7C74;font-weight:600}
.c-srow{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid #F0F4F0;cursor:pointer;font-size:13px}
.c-srow:hover{background:#F7FAF7}
.c-srow .sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

<body class="shA">

<nav id="dock" aria-label="Pilih varian mockup">
  <span class="lbl">Mockup v7</span>

<script>
/* ================= DATA (real, dari produksi pekan 28 Sep–3 Okt 2026) ================= */
const PEKAN = { label:'Pekan 28 Sep – 3 Okt 2026', sub:'Pekan ke-5 · Semester Ganjil · TA 2026/2027' };
const TOTAL = { siswa:484, kelas:17, sesi:38, pct:31, prev:38, last4:[22,35,38,31] };

/* sesi: 2=penuh, 1=sebagian, 0=kosong */
const GURU = [
  { n:'Ustadzah Ida',     s:91, k:6, ses:6, pct:0,  d:-8, last:'Belum ada input', sesi:[0,0,0,0,0,0] },
  { n:'Ustadz Andi',      s:74, k:5, ses:5, pct:0,  d:-4, last:'Belum ada input', sesi:[0,0,0,0,0]   },
  { n:'Ustadzah Rizqia',  s:82, k:6, ses:6, pct:14, d:-9, last:'2 Okt, 09.40',    sesi:[0,1,0,1,0,0] },
  { n:'Ust. Fahmi',       s:83, k:6, ses:3, pct:16, d:-2, last:'3 Okt, 07.12',    sesi:[1,0,1]       },
  { n:'Ustadzah Naya',    s:66, k:5, ses:1, pct:28, d:-6, last:'30 Sep, 08.05',   sesi:[1]           },
  { n:'Ust. Amiin',       s:34, k:3, ses:5, pct:32, d:4,  last:'3 Okt, 07.44',    sesi:[1,1,0,1,1]   },
  { n:'Ustadzah Usaidah', s:23, k:3, ses:6, pct:33, d:7,  last:'3 Okt, 09.58',    sesi:[1,2,0,1,1,0] },
  { n:'Ust. Yoki',        s:13, k:1, ses:1, pct:60, d:18, last:'1 Okt, 07.20',    sesi:[2]           },
];
const KELAS_COUNTS = {'7A':29,'7B':28,'7C':30,'7D':27,'7E':28,'8A':27,'8B':26,'8C':28,'8D':27,'8E':28,'8F':27,'9A':29,'9B':28,'9C':27,'9D':28,'9E':27,'9F':29};
/* detail Ust. Amiin (real dari produksi) */
const AMIIN = [
  { k:'8E', sw:12, ses:4, pct:0  },
  { k:'9C', sw:9,  ses:6, pct:41 },
  { k:'9F', sw:13, ses:6, pct:46 },
];
const SISWA9C = [
  { n:'Ahmad Fauzan R.',   c:6, last:'Sab 07.42', st:'good' },
  { n:'Bramantyo Aji P.',  c:5, last:'Sab 07.40', st:'good' },
  { n:'Dimas Arya S.',     c:4, last:'Kam 13.05', st:'warn' },
  { n:'Farhan Maulana',    c:3, last:'Sel 09.18', st:'warn' },
  { n:'Hafidz Rizqullah',  c:1, last:'Sen 07.35', st:'bad'  },
  { n:'Rizky Alfarizi',    c:0, last:'Belum ada input', st:'bad' },
];

const tier   = p => p>=60 ? 'st-good' : p>=25 ? 'st-warn' : 'st-bad';
const dotCol = p => p>=60 ? '#1B7F4D' : p>=25 ? '#C08A2D' : '#C96055';
const lastTxt = l => l==='Belum ada input' ? 'belum ada input' : 'terakhir '+l;
const barSesi = a => '<span class="sesi">' + a.map(v=>`<i class="${v===2?'f':v===1?'p':'m'}"></i>`).join('') + '</span>';
const delta  = d => (d>0?`<span class="st-good">+${d}</span>`:d<0?`<span class="st-bad">${d}</span>`:'<span style="color:#9AA59D">0</span>');
const LEGEND = '<span class="legend"><span><i class="f" style="background:#1B7F4D"></i>Penuh</span><span><i style="background:#C08A2D"></i>Sebagian</span><span><i style="background:#C96055"></i>Kosong</span></span>';
const GEAR_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
const CARA = '<p><b>Cara angka dihitung.</b> Siswa dianggap <b>tercatat</b> bila ada input apa pun pada sesi itu — ziyadah, murojaah, maupun tilawah (absen yang dicatat guru juga termasuk). Persentase hanya menghitung sesi yang sudah waktunya. Tanggal kegiatan/libur dan sesi Tahsin Teori (per kelompok) keluar dari penyebut. Pada tampilan Per Guru, angka hanya dihitung atas siswa bimbingan guru bersangkutan — satu kelas bisa dibimbing 2–4 guru.</p>';
const segPOV = (cls, aktif) => `<div class="${cls}-seg" data-pov>
  <button class="${aktif==='guru'?'on':''}" data-v="guru">Per Guru</button>
  <button class="${aktif==='kelas'?'on':''}" data-v="kelas">Per Kelas</button></div>`;
const tabs = cls => `<div class="${cls}-tabs">
  <button>Harian</button><button class="on">Pekanan</button><button>Bulanan</button><button>Semester</button></div>`;
/* hanya tampilan filter aktif yang terlihat — default Per Guru */
const viewGK = (g,k) => `<div data-view="guru">${g}</div><div data-view="kelas" style="display:none">${k}</div>`;

/* ---------- pembantu konten ---------- */
const tapeStats = cls => `
  <div class="${cls}-tape">
    <div class="${cls}-stat"><b>${TOTAL.pct}%</b><span>sesi terisi pekan ini</span>
      <span class="tr st-bad">−7 pts vs pekan lalu (${TOTAL.prev}%)</span></div>
    <div class="${cls}-stat"><b>${TOTAL.siswa}</b><span>siswa aktif</span></div>
    <div class="${cls}-stat"><b>${TOTAL.kelas}</b><span>kelompok kelas</span></div>
    <div class="${cls}-stat"><b>${TOTAL.sesi}</b><span>sesi Quran terjadwal</span></div>
    <div class="${cls}-stat" style="flex:0 0 150px"><span>Empat pekan terakhir</span>
      <div class="${cls==='a'?'a-trend':'b-trend'}">${TOTAL.last4.map((v,i)=>`<i style="height:${Math.max(4,v*.45)}px" class="${i===3?'cur':''}"></i>`).join('')}</div>
    </div>
  </div>`;

const guruRowsA = () => GURU.map(g=>`
  <tr class="rowh">
    <td class="hd-m"><span class="m-lbl">Guru</span>
      <div class="nm"><span class="a-dot" style="background:${dotCol(g.pct)}"></span>${g.n}
        <span class="a-sdelta" style="margin-left:6px">${delta(g.d)}</span></div>
      <div class="a-meta">${g.s} siswa · ${g.k} kelas · ${g.ses} sesi</div></td>
    <td style="min-width:170px"><div class="a-prog"><div class="bar"><i style="width:${g.pct}%"></i></div><b class="${tier(g.pct)}">${g.pct}%</b></div></td>
    <td>${barSesi(g.sesi)}</td>
    <td class="delta-m" style="text-align:right"><div style="font-size:12px;font-weight:700">${lastTxt(g.last)}</div></td>
  </tr>`).join('');

const guruCardsB = () => GURU.map(g=>`
  <div class="b-card">
    <div class="nm"><span class="a-dot" style="background:${dotCol(g.pct)}"></span>${g.n}
      <span class="a-sdelta" style="margin-left:auto">${delta(g.d)}</span></div>
    <div class="meta">${g.s} siswa · ${g.k} kelas · ${g.ses} sesi · ${lastTxt(g.last)}</div>
    <div class="b-prog"><div class="bar"><i style="width:${g.pct}%"></i></div><b class="${tier(g.pct)}">${g.pct}%</b></div>
    <div class="b-sesi">${barSesi(g.sesi)}<span class="lb">${g.ses} sesi pekan ini</span></div>
  </div>`).join('');

const kelasRowsB = () => KELAS.map(([k,s,p])=>`
  <div class="b-krow"><b>${k}</b><div class="bar"><i style="width:${p}%"></i></div><em class="${tier(p)}">${p}%</em></div>`).join('');

const guruRowsC = () => GURU.map(g=>`
  <div class="c-row">
    <div class="nm"><b><span class="a-dot" style="background:${dotCol(g.pct)}"></span>${g.n}</b>
      <span>${g.s} siswa · ${g.k} kelas · ${lastTxt(g.last)}</span></div>
    <span class="sesi">${barSesi(g.sesi)}</span>
    <div class="bar"><i style="width:${g.pct}%"></i></div>
    <span class="pc ${tier(g.pct)}">${g.pct}%</span>
    <span class="dl">${delta(g.d)}</span>
  </div>`).join('');

const detailBlock = (cls) => `
  <div class="${cls}-detail">
    <div class="${cls}-h"><h2>Ust. Amiin</h2><span>3 kelompok bimbingan · contoh rincian saat kartu guru dibuka</span></div>
    <div class="${cls}-panel">
      <div class="${cls}-ph"><h3>Kelas bimbingan</h3><span>angka hanya atas siswa bimbingan Ust. Amiin</span>${cls==='a'?LEGEND:''}</div>
      <div class="${cls==='a'?'a-kelas-cards':cls==='b'?'b-grid':'c-kelas'}" style="${cls==='b'?'padding:12px 16px;gap:10px':''}">
        ${cls==='b'
          ? AMIIN.map(x=>`<div class="b-card" style="cursor:default"><b style="font-size:13.5px">Kelas ${x.k}</b>
              <div class="meta">${x.sw} siswa bimbingan · ${x.ses} sesi</div>
              <div class="b-prog"><div class="bar"><i style="width:${x.pct}%"></i></div><b class="${tier(x.pct)}">${x.pct}%</b></div></div>`).join('')
          : AMIIN.map(x=>`<div class="${cls}-kc"><span class="kn" style="font-size:13px;font-weight:700">Kelas ${x.k}</span>
              <span class="${cls}-km ${cls==='c'?'':''}" style="font-size:11.5px;color:#6E7C74;font-weight:500;display:block;margin-top:2px">${x.sw} siswa bimbingan · ${x.ses} sesi</span>
              <div class="${cls}-prog a-prog" style="display:flex;align-items:center;gap:10px;margin-top:9px"><div class="bar" style="flex:1;background:${cls==='a'?'#E8ECE9':'#E7EDE8'}"><i style="width:${x.pct}%"></i></div><b class="${tier(x.pct)}" style="font-size:13px">${x.pct}%</b></div></div>`).join('')}
      </div>
      <div class="${cls}-ph" style="border-top:1px solid ${cls==='a'?'#EFF1EC':'#EDF1ED'}"><h3>Siswa · Kelas 9C</h3><span>6 dari 9 siswa</span></div>
      <div style="padding:4px 0">
        ${SISWA9C.map(x=>`<div style="display:flex;align-items:center;gap:12px;padding:9px 20px;border-bottom:1px solid ${cls==='a'?'#F3F5F1':'#F2F5F2'};font-size:12.5px">
          <span class="a-dot" style="background:${dotCol(x.c/6*100)}"></span>
          <b style="font-weight:700;flex:1">${x.n}</b>
          <span style="color:#79857D;font-weight:600">${x.last}</span>
          <b style="font-variant-numeric:tabular-nums;width:46px;text-align:right" class="${tier(x.c/6*100)}">${x.c}/6</b></div>`).join('')}
        <button class="${cls}-sw">Tampilkan semua 9 siswa</button>
      </div>
    </div>
  </div>`;

/* ===== donat & data drill-down (varian C) — alur sama dgn produksi ===== */
const donut = (pct,size=64,sw=8) => {
  const col = pct>=60?'#1B7F4D':pct>=25?'#C08A2D':'#C96055';
  const r=(size-sw)/2, c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);display:block" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E7EDE8" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${(pct/100*c).toFixed(1)} ${c.toFixed(1)}"/>
  </svg>`;
};
const donutC = (pct,size=64,sw=8) =>
  `<div class="gc-donut" style="width:${size}px;height:${size}px">${donut(pct,size,sw)}<div class="gc-dc"><b>${pct}%</b><span>terisi</span></div></div>`;

/* guru → kelompok bimbingan. Ust. Amiin = data real produksi; sisanya contoh seangka kartu gurunya */
const GURU_KELAS_SPEC = {
  'Ustadzah Ida':     ['7A','7B','7C','7D','8A','8D'],
  'Ustadz Andi':      ['7D','7E','8A','8B','9A'],
  'Ustadzah Rizqia':  ['7B','8C','8D','9A','9C','9D'],
  'Ust. Fahmi':       ['7B','8B','8F','9B','9D','9E'],
  'Ustadzah Naya':    ['7C','7E','7D','9A','9B'],
  'Ust. Amiin':       ['8E','9C','9F'],
  'Ustadzah Usaidah': ['8C','8F','9E'],
  'Ust. Yoki':        ['7A'],
};
const GURU_KELAS = {};
Object.entries(GURU_KELAS_SPEC).forEach(([nm,ks],gi)=>{
  const g = GURU.find(x=>x.n===nm);
  const per = Math.round(g.s/ks.length);
  GURU_KELAS[nm] = ks.map((k,i)=>({
    k, sw: i===ks.length-1 ? g.s-per*(ks.length-1) : per,
    ses: 4+((gi+i)%3),
    pct: Math.max(0, Math.min(100, g.pct + ((gi*7+i*13)%7)-3)),
  }));
});
GURU_KELAS['Ust. Amiin'] = AMIIN.map(x=>({...x}));
/* persentase kelas = rata-rata kelompok guru di kelas itu */
const KELAS_AGG = {};
Object.values(GURU_KELAS).flat().forEach(x=>(KELAS_AGG[x.k]=KELAS_AGG[x.k]||[]).push(x.pct));
const kelasPct = k => Math.round(KELAS_AGG[k].reduce((a,b)=>a+b,0)/KELAS_AGG[k].length);
const KELAS = Object.keys(KELAS_COUNTS).map(k=>[k,KELAS_COUNTS[k],kelasPct(k)]);

/* pola hari per kelas (contoh; 8E/9C/9F mengikuti produksi) */
const HARI_OVERRIDE = {
  '8E':[['Rab','m'],['Sab','m']],
  '9C':[['Sen','f'],['Sel','p'],['Rab','p'],['Jum','f'],['Sab','m']],
  '9F':[['Sen','f'],['Sel','p'],['Rab','p'],['Kam','m'],['Jum','p']],
};
Object.keys(HARI_OVERRIDE).forEach(k=>{
  HARI_OVERRIDE[k] = HARI_OVERRIDE[k].map(([d,st])=>({d,st}));
});
const hashDays = (k,p) => {
  let h=0; for(const ch of k) h=(h*31+ch.charCodeAt(0))>>>0;
  const days=['Sen','Sel','Rab','Kam','Jum','Sab'];
  return days.slice(0,4+(h%3)).map((d,i)=>{
    const v=((h>>(i%4))%10)/10;
    return {d, st: v<p/100 ? 'f' : v<p/100+0.25 ? 'p' : 'm'};
  });
};
const hariOf = k => HARI_OVERRIDE[k] || hashDays(k,kelasPct(k));

/* siswa contoh per kelas (9C = real) */
const NAMA_L=['Ahmad Fauzan R.','Bramantyo Aji P.','Dimas Arya S.','Farhan Maulana','Hafidz Rizqullah','Rizky Alfarizi','Galih Saputra','Ilham Ramadhan','Zaki Mubarok','Bagas Prakoso','Naufal Hidayat','Rafi Athaya'];
const NAMA_P=['Aisyah Nur H.','Bilqis Ananda','Cinta Maharani','Dewi Anggraini','Elsa Fitriani','Fahira Zahra','Gita Puspita','Hanum Salsabila','Indah Permata','Jihan Aulia','Kayla Nazhifah','Laila Ramadhani'];
const WAKTU=['Sab 07.42','Kam 13.05','Sel 09.18','Sen 07.35','Jum 08.10','Rab 07.50'];
const siswaFor = k => {
  if(k==='9C') return SISWA9C;
  const s=KELAS_COUNTS[k], n=Math.min(s,8), base=Math.round(kelasPct(k)/100*6);
  const pool = /[DEF]$/.test(k)?NAMA_P:NAMA_L;
  return Array.from({length:n},(_,i)=>{
    const c=Math.max(0,Math.min(6,base+((i*5+k.charCodeAt(1))%3)-1));
    return {n:pool[(i*3+k.charCodeAt(1))%pool.length], c, last:c?WAKTU[i%6]:'Belum ada input'};
  });
};
/* rekap sesi utk detail siswa */
const REKAP_HARI=[['Sab',1],['Jum',2],['Kam',2],['Rab',3],['Sel',3],['Sen',4]];
const SURAH_R=['Al-Baqarah 1–10','Ali \'Imran 1–5','An-Nisa 1–6','Al-Maidah 1–7','Al-An\'am 1–6','Maryam 1–5'];
const rekapFor = c => REKAP_HARI.map((h,i)=> i<c
  ? {d:h[0],j:h[1],t:i%2?'Murojaah':'Ziyadah',r:SURAH_R[i%6],ok:true}
  : {d:h[0],j:h[1],ok:false});

/* state & renderer varian C (alur: daftar → guru → kelas → siswa) */
const CST = {pov:'guru', view:'list', guru:null, kelas:null, from:'list', siswa:null};
const cHead = `<header class="c-band"><div class="c-in">
  <div class="c-r1">
    <div class="c-brand">Lapor Tahfidz<small>SMP ABBS · Rekap Hafalan</small></div>
    <div class="c-seg">${['guru','kelas'].map(v=>`<button data-povc="${v}" class="${CST.pov===v?'on':''}">${v==='guru'?'Per Guru':'Per Kelas'}</button>`).join('')}</div>
    <button class="c-gear gear" aria-label="Admin">${GEAR_SVG}</button>
  </div>
  <div class="c-r2">
    <div class="c-per"><h1>${PEKAN.label}</h1><p>${PEKAN.sub}</p></div>
    <div class="c-nav">
      <button aria-label="Sebelumnya">‹</button><button aria-label="Berikutnya">›</button>
      <button class="now">Hari ini</button>
    </div>
    <div>${tabs('c')}</div>
  </div>
</div></header>`;
const daysHtml = k => `<div class="gc-days">${hariOf(k).map(h=>`<span><i class="${h.st}"></i><em>${h.d}</em></span>`).join('')}</div>`;

function guruGrid(){
  return `<details class="c-note"><summary><span class="ic">i</span>Cara angka dihitung</summary>${CARA}</details>
  <div class="c-h"><h2>Semua Guru</h2><span>8 guru pengampu · paling perlu perhatian di atas</span>${LEGEND}</div>
  <div class="c-cards c-cards-guru">${GURU.map(g=>{
    const kosong=g.sesi.filter(v=>v===0).length;
    return `<div class="c-gcard" data-open-guru="${g.n}" role="button" tabindex="0">
      <div class="gc-top">
        <div class="gc-who"><b>${g.n}</b><span>${g.s} siswa · ${g.k} kelas</span>
          <span>${g.ses} sesi · ${kosong?kosong+' belum terisi':'semua terisi'}</span></div>
        ${donutC(g.pct,64,8)}
      </div>
      <div class="gc-foot">${barSesi(g.sesi)}<span class="lb">sesi pekan ini</span><span class="last">${lastTxt(g.last)}</span></div>
    </div>`;}).join('')}</div>`;
}
function kelasGrid(){
  return `<details class="c-note"><summary><span class="ic">i</span>Cara angka dihitung</summary>${CARA}</details>
  <div class="c-h"><h2>Semua Kelas</h2><span>17 kelas · ${PEKAN.label}</span>${LEGEND}</div>
  <div class="c-cards">${KELAS.map(([k,s])=>`
    <div class="c-gcard" data-open-kelas="${k}" role="button" tabindex="0">
      <div class="gc-top">
        <div class="gc-badge">${k}</div>
        <div class="gc-who"><b>Kelas ${k}</b><span>${s} siswa</span><span>${hariOf(k).length} sesi terjadwal</span></div>
        ${donutC(kelasPct(k),64,8)}
      </div>
      ${daysHtml(k)}
    </div>`).join('')}</div>`;
}
function guruDetail(){
  const g = GURU.find(x=>x.n===CST.guru);
  const ks = GURU_KELAS[g.n];
  return `<div class="c-topnav"><button class="c-back" data-back="list">‹ Semua guru</button>
    <h2>${g.n}</h2><span class="sub2">${ks.length} kelompok bimbingan · ${PEKAN.label}</span></div>
  <div class="c-cards">${ks.map(x=>`
    <div class="c-gcard" data-open-kelas="${x.k}" role="button" tabindex="0">
      <div class="gc-top">
        <div class="gc-badge">${x.k}</div>
        <div class="gc-who"><b>Kelas ${x.k}</b><span>${x.sw} siswa bimbingan</span><span>${x.ses} sesi terjadwal</span></div>
        ${donutC(x.pct,56,7)}
      </div>
      ${daysHtml(x.k)}
    </div>`).join('')}</div>`;
}
function kelasDetail(){
  const k = CST.kelas;
  const s = KELAS_COUNTS[k];
  const siswa = siswaFor(k);
  const back = CST.from==='guru' ? {v:'guru',lb:'‹ '+CST.guru} : {v:'list',lb:CST.pov==='guru'?'‹ Semua guru':'‹ Semua kelas'};
  return `<div class="c-topnav"><button class="c-back" data-back="${back.v}">${back.lb}</button>
    <h2>Kelas ${k}</h2><span class="sub2">${PEKAN.label}</span></div>
  <div class="c-panel">
    <div class="c-summary">
      <div class="gc-badge">${k}</div>
      <div class="c-sum-who"><b>Kelas ${k}</b><span>${s} siswa · ${hariOf(k).length} sesi terjadwal</span></div>
      ${donutC(kelasPct(k),78,9)}
    </div>
    <div style="padding:0 20px 4px">${daysHtml(k)}</div>
    <div class="c-shead" style="border-top:1px solid #EDF1ED;margin-top:10px"><b>Siswa</b><span>${siswa.length} dari ${s} siswa · paling perlu perhatian di atas</span></div>
    ${siswa.map(x=>`<div class="c-srow" data-open-siswa="${x.n}" role="button" tabindex="0">
      <i class="sdot" style="background:${dotCol(x.c/6*100)}"></i><b>${x.n}</b>
      <span class="tm">${x.last}</span><em class="${tier(x.c/6*100)}">${x.c}/6</em><span class="chev">›</span></div>`).join('')}
    ${siswa.length<s?`<button class="c-sw">Tampilkan semua ${s} siswa</button>`:''}
  </div>`;
}
function siswaDetail(){
  const nm = CST.siswa, k = CST.kelas;
  const cnt = (siswaFor(k).find(x=>x.n===nm)||{c:3}).c;
  return `<div class="c-topnav"><button class="c-back" data-back="kelas">‹ Kelas ${k}</button>
    <h2>${nm}</h2><span class="sub2">Kelas ${k} · ${cnt}/6 sesi tercatat pekan ini</span></div>
  <div class="c-panel">
    <div class="c-shead"><b>Rekap sesi</b><span>Pekanan · ${PEKAN.label}</span></div>
    ${rekapFor(cnt).map(r=>`<div class="c-rrow">
      <span class="rd">${r.d}<em>jam ke-${r.j}</em></span>
      <span class="tagc ${r.ok?(r.t==='Ziyadah'?'z':'m'):'na'}">${r.ok?r.t:'—'}</span>
      <b class="rg ${r.ok?'':'na'}">${r.ok?r.r:'Belum ada input'}</b>
      <span class="tagc ${r.ok?'ok':'no'}">${r.ok?'Tercatat':'Belum ada input'}</span></div>`).join('')}
  </div>`;
}
function renderC(){
  const body = CST.view==='list'  ? (CST.pov==='guru'?guruGrid():kelasGrid())
             : CST.view==='guru'  ? guruDetail()
             : CST.view==='kelas' ? kelasDetail()
             : siswaDetail();
  return `<div class="tC">${cHead}<main class="c-wrap">${body}</main></div>`;
}

/* ================= RENDER PER VARIAN ================= */
function renderA(){
  return `
  <div class="tA">
    <header class="a-top"><div class="a-in">
      <div class="a-r1">
        <span class="a-brand"><span class="mark"></span>Lapor Tahfidz</span>
        ${segPOV('a','guru')}
        ${tabs('a')}
        <button class="a-gear gear" aria-label="Admin">${GEAR_SVG}</button>
      </div>
      <div class="a-r2">
        <button class="a-nav" aria-label="Sebelumnya">‹</button>
        <div class="a-per">${PEKAN.label}<small>${PEKAN.sub}</small></div>
        <button class="a-nav" aria-label="Berikutnya">›</button>
        <button class="a-today">Hari ini</button>
      </div>
    </div></header>
    <main class="a-wrap">
      <details class="a-cara"><summary><span class="ic">i</span>Cara angka dihitung</summary>${CARA}</details>
      ${tapeStats('a')}
      <div class="a-h"><h2>Semua Guru</h2><span>diurutkan dari yang paling perlu perhatian · ${PEKAN.label}</span>${LEGEND}</div>
      ${viewGK(`
        <table class="a-table"><thead><tr>
          <th>Guru</th><th>Progres pekan ini</th><th>Sesi</th><th class="r">Input terakhir</th>
        </tr></thead><tbody>${guruRowsA()}</tbody></table>`,
        `<table class="a-table"><thead><tr>
          <th>Kelas</th><th>Progres pekan ini</th><th class="r">Siswa</th>
        </tr></thead><tbody>${KELAS.map(([k,s,p])=>`
          <tr class="rowh"><td class="hd-m"><span class="m-lbl">Kelas</span>
            <div class="nm"><span class="a-dot" style="background:${dotCol(p)}"></span>Kelas ${k}</div></td>
            <td><div class="a-prog"><div class="bar"><i style="width:${p}%"></i></div><b class="${tier(p)}">${p}%</b></div></td>
            <td style="text-align:right;font-weight:700;font-variant-numeric:tabular-nums">${s}</td></tr>`).join('')}
        </tbody></table>`)}
      ${detailBlock('a')}
    </main>
  </div>`;
}

function renderB(){
  return `
  <div class="tB">
    <header class="b-top">
      <div class="b-in">
        <span class="b-brand"><span class="mark"><i></i></span>Lapor Tahfidz</span>
        ${segPOV('b','guru')}
        ${tabs('b')}
        <button class="b-gear gear" aria-label="Admin">${GEAR_SVG}</button>
      </div>
      <div class="b-in2">
        <button class="b-nav" aria-label="Sebelumnya">‹</button>
        <div class="b-per">${PEKAN.label} <small>· ${PEKAN.sub}</small></div>
        <button class="b-nav" aria-label="Berikutnya">›</button>
        <button class="b-today">Hari ini</button>
      </div>
    </header>
    <main class="b-wrap">
      ${tapeStats('b')}
      <div class="b-cols">
        <section>
          <div class="b-h"><h2>Semua Guru</h2><span>paling perlu perhatian di atas</span></div>
          ${viewGK(`<div class="b-grid">${guruCardsB()}</div>`,
            `<div class="b-grid">${KELAS.map(([k,s,p])=>`
              <div class="b-card"><div class="nm"><span class="a-dot" style="background:${dotCol(p)}"></span>Kelas ${k}
                <span class="a-sdelta" style="margin-left:auto;font-size:12px">${s} siswa</span></div>

          ${detailBlock('b')}
        </section>
        <aside class="b-aside">
          <div class="b-panel"><h3>Kelas</h3><div class="sub">17 kelas · ${PEKAN.label}</div>${kelasRowsB()}</div>
          <div class="b-panel"><h3>Cara angka dihitung</h3><div class="b-note"><b>Tercatat</b> = ada input apa pun pada sesi itu: ziyadah, murojaah, atau tilawah. Persentase hanya atas sesi yang sudah waktunya; tanggal kegiatan/libur dan sesi Tahsin Teori keluar dari hitungan. Pada Per Guru, angka hanya atas siswa bimbingan guru bersangkutan.</div></div>
          <div class="b-panel">${LEGEND.replace('class="legend"','class="legend" style="color:#75797D"')}</div>
        </aside>
      </div>

  </div>`;
}

/* ================= SWITCHER & POV ================= */
const app = document.getElementById('app');
function show(t){
  document.body.className = 'sh'+t;
  app.innerHTML = {A:renderA,B:renderB,C:renderC}[t]();
  document.querySelectorAll('#dock button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  bindPOV();
}
function bindPOV(){
  document.querySelectorAll('[data-pov]').forEach(seg=>{
    seg.addEventListener('click', e=>{
      const b = e.target.closest('button'); if(!b) return;
      seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
      const container = seg.closest('.a-wrap,.b-wrap,section,.c-wrap') || document;
      container.querySelectorAll('[data-view]').forEach(v=>{
        v.style.display = v.dataset.view===b.dataset.v ? '' : 'none';
      });
    });
  });
}
document.getElementById('dock').addEventListener('click', e=>{
  const b = e.target.closest('button[data-t]'); if(b) show(b.dataset.t);
});
/* navigasi drill-down varian C (delegasi, sekali pasang) */
if(!app.__boundC){
  app.__boundC = true;
  app.addEventListener('click', e=>{
    if(document.body.className!=='shC') return;
    const t=e.target.closest('[data-open-guru],[data-open-kelas],[data-open-siswa],[data-back],[data-povc]');
    if(!t) return;
    if(t.dataset.povc){CST.pov=t.dataset.povc;CST.view='list';}
    else if(t.dataset.openGuru){CST.guru=t.dataset.openGuru;CST.from='list';CST.view='guru';}
    else if(t.dataset.openKelas){CST.kelas=t.dataset.openKelas;CST.from=(CST.view==='guru')?'guru':'list';CST.view='kelas';}
    else if(t.dataset.openSiswa){CST.siswa=t.dataset.openSiswa;CST.view='siswa';}
    else if(t.dataset.back){CST.view=t.dataset.back;}
    else return;
    app.innerHTML=renderC();
  });
  app.addEventListener('keydown', e=>{
    if(document.body.className!=='shC') return;
    if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('[data-open-guru],[data-open-kelas],[data-open-siswa]')){
      e.preventDefault(); e.target.click();
    }
  });
}
show('A');
</script>
</body>
</html>
