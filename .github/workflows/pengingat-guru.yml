name: Pengingat WA guru belum input

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (tidak kirim WA sungguhan)"
        type: boolean
        default: true
      test_phone:
        description: "Opsional: belokkan semua WA ke 1 nomor test (format 62xxxx)"
        type: string
        default: ""

# Catatan: blok `schedule:` ditambahkan di commit terpisah setelah hasil
# dry-run & test kirim nyata dikonfirmasi oleh user -- lihat
# C:\Users\kurikulum\.claude\plans\warm-mapping-teacup.md

jobs:
  kirim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Jalankan pengingat
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_OVERRIDE_PHONE: ${{ inputs.test_phone }}
        run: node scripts/kirim-pengingat-guru.mjs
