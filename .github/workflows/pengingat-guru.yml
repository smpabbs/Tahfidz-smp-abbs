name: Pengingat WA guru belum input

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (tidak kirim WA sungguhan)"
        type: boolean
        default: true
      test_phone:
        description: "Opsional: belokkan semua WA ke 1 nomor test (format 62xxxx)"
        type: string
        default: ""
  schedule:
    # Semua jam WIB (UTC+7), dikonversi ke UTC untuk cron GitHub Actions.
    - cron: "0 5 * * 1,2,3,5"   # Senin/Selasa/Rabu/Jumat 12.00 WIB
    - cron: "20 8 * * 1,2,3,5"  # Senin/Selasa/Rabu/Jumat 15.20 WIB
    - cron: "0 5 * * 4"         # Kamis 12.00 WIB (sesi Kamis selalu kelar sebelum jam 12)
    - cron: "50 3 * * 6"        # Sabtu 10.50 WIB
    # Minggu: tidak ada jadwal Quran, sengaja tidak dibuat cron.
    # Catatan: trigger `schedule` TIDAK membaca default `inputs.*` --
    # DRY_RUN/TEST_OVERRIDE_PHONE otomatis kosong di run terjadwal (kirim nyata).

jobs:
  kirim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Jalankan pengingat
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_OVERRIDE_PHONE: ${{ inputs.test_phone }}
        run: node scripts/kirim-pengingat-guru.mjs
